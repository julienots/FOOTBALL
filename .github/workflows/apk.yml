name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Download realistic voices (Piper)
        run: |
          HF=https://huggingface.co/rhasspy/piper-voices/resolve/main/fr/fr_FR
          mkdir -p public/voices
          for v in gilles/low/fr_FR-gilles-low tom/medium/fr_FR-tom-medium; do
            f=$(basename $v)
            curl -fL --retry 4 -o public/voices/$f.onnx $HF/$v.onnx
            curl -fL --retry 4 -o public/voices/$f.onnx.json $HF/$v.onnx.json
          done
          ls -la public/voices

      - name: Build web app
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../SportTV-IA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SportTV-IA-apk
          path: SportTV-IA.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sport TV IA v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: SportTV-IA.apk
          body: |
            Application Android **Sport TV IA** (branche `${{ github.ref_name }}`).

            Téléchargez `SportTV-IA.apk` depuis votre téléphone, puis ouvrez-le pour l'installer
            (autorisez l'installation depuis des sources inconnues si Android le demande).
